# nginx для Бауман.Игры. Ставится в /etc/nginx/sites-available/bmstu_quiz,
# __DOMAIN__ подставляет deploy.sh. Приложение слушает только 127.0.0.1:5000.

# Брутфорс пароля: не больше 10 попыток входа в минуту с одного IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Общий лимит щедрый: на площадке десятки команд выходят в сеть с одного NAT-адреса.
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Запросы по IP или чужому Host (сканеры) — закрываем соединение без ответа.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 55m;   # MAX_CONTENT_LENGTH приложения — 50 МБ
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn perip 200;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss://__DOMAIN__ https:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket: без лимита запросов, длинные таймауты.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    location /static/ {
        limit_req zone=general burst=300 nodelay;
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
    }

    # Служебные и скрытые файлы — никогда.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        limit_req zone=general burst=300 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_read_timeout 120s;
    }
}
