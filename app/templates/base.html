<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Бауманка.Квиз{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200">

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
    {% for category, message in messages %}
    <div class="alert {% if category == 'error' %}alert-error{% elif category == 'success' %}alert-success{% elif category == 'warning' %}alert-warning{% else %}alert-info{% endif %} shadow-lg max-w-sm">
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
<script>
setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => el.remove());
}, 4000);
</script>
{% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
