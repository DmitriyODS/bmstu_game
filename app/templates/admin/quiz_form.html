{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Новый квиз' if not quiz else 'Редактировать квиз' }} — Бауман.Игра{% endblock %}

{% block admin_content %}
<div class="max-w-lg">
    <h1 class="text-2xl sm:text-3xl font-bold mb-6">{{ 'Новый квиз' if not quiz else 'Редактировать квиз' }}</h1>
    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <form method="POST">
                <div class="form-control mb-4">
                    <label class="label"><span class="label-text font-medium">Название *</span></label>
                    <input type="text" name="title" class="input input-bordered"
                           value="{{ quiz.title if quiz else '' }}" required>
                </div>
                <div class="form-control mb-6">
                    <label class="label"><span class="label-text font-medium">Описание</span></label>
                    <textarea name="description" class="textarea textarea-bordered" rows="3">{{ quiz.description if quiz else '' }}</textarea>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined icon-sm">save</span>
                        Сохранить
                    </button>
                    <a href="{{ url_for('admin.quizzes') }}" class="btn btn-ghost">Отмена</a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
