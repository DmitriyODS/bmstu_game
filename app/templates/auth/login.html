{% extends "base.html" %}
{% block title %}Вход — Бауманка.Квиз{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="card w-96 bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl justify-center mb-4">🎯 Бауманка.Квиз</h2>
            <form method="POST">
                <div class="form-control mb-3">
                    <label class="label"><span class="label-text">Логин</span></label>
                    <input type="text" name="username" class="input input-bordered" required autofocus>
                </div>
                <div class="form-control mb-6">
                    <label class="label"><span class="label-text">Пароль</span></label>
                    <input type="password" name="password" class="input input-bordered" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
