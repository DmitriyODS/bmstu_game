{% extends "base.html" %}
{% block title %}Вход — Бауманка.Квиз{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="flex flex-col items-center mb-6">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Логотип" class="h-14 w-auto mb-3">
                <h2 class="text-2xl font-bold text-center">Бауманка.Квиз</h2>
            </div>
            <form method="POST">
                <div class="form-control mb-3">
                    <label class="label"><span class="label-text">Логин</span></label>
                    <input type="text" name="username" class="input input-bordered" required autofocus>
                </div>
                <div class="form-control mb-6">
                    <label class="label"><span class="label-text">Пароль</span></label>
                    <input type="password" name="password" class="input input-bordered" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
