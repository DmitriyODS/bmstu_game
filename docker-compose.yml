services:
  web:
    build: .
    ports:
      # Только localhost: наружу приложение отдаёт nginx (TLS, заголовки, лимиты).
      # Docker публикует порты в обход ufw, поэтому 0.0.0.0 здесь недопустим.
      - "127.0.0.1:5000:5000"
    env_file: .env
    volumes:
      - uploads_data:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
